line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]

[lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]  # settings use `from .base import *`

[lint.isort]
known-first-party = ["apps", "config", "bot"]
